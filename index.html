<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAFIA">
<title>MAFIA: ІМПЕРІЯ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29272a,#101114 55%);color:#f2f0eb;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 90px}
:root{--gold:#c9a15a;--muted:#a2a4aa;--line:#343740}
header{padding:23px 19px 16px;border-bottom:1px solid var(--line);background:#111216dd}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);font-weight:800}.brand{font-size:29px;font-weight:950;letter-spacing:1px;margin-top:6px}.brand span{color:var(--gold)}.sub{color:var(--muted);font-size:12px;margin-top:5px}
main{max-width:800px;margin:auto;padding:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat,.card{background:linear-gradient(145deg,#22242a,#17191e);border:1px solid var(--line);border-radius:14px;padding:13px}.stat small,.desc{color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:5px}
nav{display:flex;gap:6px;overflow:auto;padding:14px 0;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#191b20;color:#bbb;border-radius:999px;padding:10px 13px}.tab.active{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:900}
h2{font-size:19px;margin:8px 0 12px}h3{font-size:15px;margin:0 0 6px}.desc{font-size:13px;line-height:1.45}.card{margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.primary,.action{font:inherit;border-radius:11px;padding:12px 14px}.primary{background:var(--gold);border:0;color:#171717;font-weight:900}.action{display:block;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:#24262d;color:#f4f0e8}.action:disabled,.primary:disabled{opacity:.4}.badge{font-size:10px;color:var(--gold);border:1px solid #725c37;padding:4px 7px;border-radius:999px}
.city{height:270px;position:relative;overflow:hidden;border:1px solid #45434a;border-radius:16px;background:linear-gradient(#101722,#27242a 58%,#101114);perspective:650px;margin:10px 0 14px}.city:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#d2a35a22,transparent 50%)}.world{position:absolute;left:50%;top:47%;width:530px;height:360px;transform:translate(-50%,-35%) rotateX(58deg) rotateZ(-35deg);transform-style:preserve-3d}.ground{position:absolute;inset:0;background-color:#171a20;background-image:linear-gradient(#39343a 1px,transparent 1px),linear-gradient(90deg,#39343a 1px,transparent 1px);background-size:58px 58px;border:1px solid #5a4c3a}.building{position:absolute;width:42px;height:42px;background:#30343e;border:1px solid #62606a;box-shadow:4px 4px 0 #17191f,8px 8px 0 #0b0c10}.building:before{content:"";position:absolute;left:100%;top:5px;width:8px;height:100%;background:#1a1c23;transform:skewY(35deg)}.building:after{content:"";position:absolute;left:5px;top:-8px;width:100%;height:8px;background:#56515a;transform:skewX(55deg)}.building.tall{height:75px;background:#383a44}.building.gold{background:#5b4932;border-color:var(--gold)}.pin{position:absolute;z-index:3;border:1px solid #d0a75f;background:#17191eee;color:#f1d39a;border-radius:9px;padding:7px 9px;font-size:10px}.p1{left:7%;bottom:15%}.p2{right:7%;bottom:18%}.p3{left:39%;top:19%}.p4{right:7%;top:12%}.p5{left:40%;bottom:10%}.event{border-left:2px solid var(--gold);padding:8px 12px;margin:9px 0;background:#1b1d22;border-radius:0 10px 10px 0}
footer{position:fixed;bottom:0;left:0;right:0;padding:11px 15px calc(11px + env(safe-area-inset-bottom));background:#111216ed;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px);font-size:11px;letter-spacing:1px;color:var(--gold)}
@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="eyebrow">NEW YORK · 2026</div><div class="brand">MAFIA <span>ІМПЕРІЯ</span></div><div class="sub">Ти — Дон. Місто пам'ятає кожне рішення.</div></header>
<main><section id="stats" class="stats"></section>
<nav><button class="tab active" data-tab="home">Штаб</button><button class="tab" data-tab="city">3D місто</button><button class="tab" data-tab="family">Сім'я</button><button class="tab" data-tab="business">Бізнес</button><button class="tab" data-tab="police">Поліція</button><button class="tab" data-tab="history">Хроніка</button></nav>
<section id="screen"></section></main>
<footer><span id="turn">ХІД 1</span><button class="primary" id="next">ЗАВЕРШИТИ ХІД →</button></footer>
<script>
const seed={turn:1,cash:100000,influence:10,reputation:50,loyalty:60,heat:15,gang:75,cars:2,businesses:0,cases:0,prisoners:0,police:68,tab:"home",events:["Засновано нову сім'ю. Штаб відкрито."],districts:[{id:"man",name:"Манхеттен",cost:25000,owned:false},{id:"bro",name:"Бруклін",cost:15000,owned:false},{id:"que",name:"Квінз",cost:18000,owned:false},{id:"bronx",name:"Бронкс",cost:12000,owned:false},{id:"port",name:"Портовий район",cost:20000,owned:false}]};
let s;try{s=JSON.parse(localStorage.getItem("mafia-imperia-single"))||structuredClone(seed)}catch{s=structuredClone(seed)}
const money=n=>"$"+n.toLocaleString("en-US"),log=t=>{s.events.unshift("Хід "+s.turn+": "+t);s.events=s.events.slice(0,60)},save=()=>localStorage.setItem("mafia-imperia-single",JSON.stringify(s));
function stats(){document.querySelector("#stats").innerHTML=[["КАПІТАЛ",money(s.cash)],["ВПЛИВ",s.influence+"/100"],["РЕПУТАЦІЯ",s.reputation+"/100"],["УВАГА ПОЛІЦІЇ",s.heat+"/100"]].map(([a,b])=>`<div class="stat"><small>${a}</small><strong>${b}</strong></div>`).join("");document.querySelector("#turn").textContent="ХІД "+s.turn}
const btn=(label,a,disabled=false)=>`<button class="action" data-action="${a}" ${disabled?"disabled":""}>${label}</button>`;
function city(){let blocks="";for(let r=0;r<5;r++)for(let c=0;c<8;c++){let cls=((r*3+c*7)%4===0?"tall ":"")+((r+c)%7===0?"gold":"");blocks+=`<i class="building ${cls}" style="left:${c*62+9}px;top:${r*66+12}px"></i>`}return `<div class="city"><div style="position:absolute;z-index:4;top:12px;left:13px;color:var(--gold);font-size:10px;letter-spacing:2px">NEW YORK · 3D DISTRICT VIEW</div><div class="world"><div class="ground"></div>${blocks}</div>${s.districts.map((d,i)=>`<button class="pin p${i+1}" data-pick="${d.id}">${d.name}${d.owned?" ✓":""}</button>`).join("")}</div>`}
function render(){stats();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===s.tab));let h="";
if(s.tab==="home")h=`<h2>Центральний штаб</h2><div class="card"><span class="badge">КАМПАНІЯ АКТИВНА</span><h3 style="margin-top:10px">Вітаємо, Доне.</h3><p class="desc">Твоя сім'я розбудовує бізнес та вплив. Місто й інституції діють автономно.</p><p class="desc">Банда: ${s.gang} · Бізнесів: ${s.businesses} · Автомобілів: ${s.cars}</p></div>${btn("Інвестувати в бізнес · $20 000","invest",s.cash<20000)}${btn("Підтримати громаду · $8 000","community",s.cash<8000)}${btn("Ділові переговори · $5 000","talk",s.cash<5000)}`;
if(s.tab==="city")h=`<h2>Місто · 3D-мапа</h2>${city()}<p class="desc">Обери район на перспективній карті або у списку нижче.</p>${s.districts.map(d=>`<div class="card row"><div><h3>${d.name}</h3><span class="desc">${d.owned?"Твоя ділова мережа":"Розвиток: "+money(d.cost)}</span></div>${d.owned?'<span class="badge">ТВІЙ</span>':`<button class="primary" data-pick="${d.id}" ${s.cash<d.cost?"disabled":""}>Розвивати</button>`}</div>`).join("")}`;
if(s.tab==="family")h=`<h2>Управління сім'єю</h2><div class="card"><h3>Віктор Коваль</h3><p class="desc">Ватажок команди · Лояльність ${s.loyalty}/100</p><span class="badge">ПРИЗНАЧЕНИЙ</span></div><div class="card"><h3>Банда · ${s.gang}/100</h3><p class="desc">Цільова чисельність — 75–100 учасників.</p>${btn("Найняти п'ятьох · $10 000","recruit",s.cash<10000||s.gang>95)}</div><div class="card"><h3>Автопарк · ${s.cars} автомобілі</h3>${btn("Придбати автомобіль · $18 000","car",s.cash<18000)}</div>`;
if(s.tab==="business")h=`<h2>Бізнес та фінанси</h2><div class="card"><h3>Підприємства: ${s.businesses}</h3><p class="desc">Дохід за хід: ${money(7000+s.businesses*3500)}. Витрати враховуються автоматично.</p>${btn("Відкрити новий бізнес · $20 000","invest",s.cash<20000)}</div><div class="card"><h3>Громадські ініціативи</h3>${btn("Підтримати громаду · $8 000","community",s.cash<8000)}</div>`;
if(s.tab==="police")h=`<h2>Поліція та суди</h2><div class="card"><span class="badge">АВТОНОМНИЙ ДЕПАРТАМЕНТ</span><p class="desc">Активність поліції: ${s.police}/100</p><p class="desc">Перевірки: ${s.cases} · Ув'язнені персонажі: ${s.prisoners}</p><p class="desc">Поліція самостійно змінює пріоритети. Корупційні сюжети показані як абстрактні скандали та службові розслідування.</p>${btn("Законний перегляд справи адвокатом · $10 000","legal",s.cash<10000||s.prisoners===0)}</div>`;
if(s.tab==="history")h=`<h2>Хроніка міста</h2>${s.events.map(e=>`<div class="event">${e}</div>`).join("")}`;
document.querySelector("#screen").innerHTML=h}
function act(a){if(a==="invest"&&s.cash>=20000){s.cash-=20000;s.businesses++;s.influence=Math.min(100,s.influence+3);s.reputation=Math.min(100,s.reputation+2);log("Інвестовано в новий бізнес.")}if(a==="community"&&s.cash>=8000){s.cash-=8000;s.reputation=Math.min(100,s.reputation+8);s.loyalty=Math.min(100,s.loyalty+4);s.heat=Math.max(0,s.heat-2);log("Профінансовано соціальний проєкт.")}if(a==="talk"&&s.cash>=5000){s.cash-=5000;s.influence=Math.min(100,s.influence+5);log("Проведено ділові переговори.")}if(a==="recruit"&&s.cash>=10000&&s.gang<=95){s.cash-=10000;s.gang+=5;s.loyalty=Math.min(100,s.loyalty+3);log("До команди приєдналися п'ять учасників.")}if(a==="car"&&s.cash>=18000){s.cash-=18000;s.cars++;log("Автопарк поповнено автомобілем.")}if(a==="legal"&&s.cash>=10000&&s.prisoners>0){s.cash-=10000;s.prisoners--;log("Після законного перегляду справи персонажа звільнено.")}save();render()}
document.addEventListener("click",e=>{let t=e.target.closest("[data-tab]");if(t){s.tab=t.dataset.tab;render();return}let a=e.target.closest("[data-action]");if(a){act(a.dataset.action);return}let p=e.target.closest("[data-pick]");if(p){let d=s.districts.find(x=>x.id===p.dataset.pick);if(d&&!d.owned&&s.cash>=d.cost){s.cash-=d.cost;d.owned=true;s.influence=Math.min(100,s.influence+8);log("Розширено ділову присутність у районі "+d.name+".");save();render()}}});
document.querySelector("#next").addEventListener("click",()=>{s.turn++;let income=7000+s.businesses*3500,upkeep=5000+s.businesses*1000+Math.floor(s.gang/25)*1000;s.cash=Math.max(0,s.cash+income-upkeep);log(`Дохід ${money(income)}, витрати ${money(upkeep)}.`);if(s.turn%3===0){s.cases++;s.heat=Math.min(100,s.heat+4);log("Автономна поліція відкрила нову перевірку.")}if(s.turn%5===0){s.police=Math.min(100,s.police+2);log("Поліцейський департамент оновив пріоритети.")}if(s.turn%7===0&&s.cases>0){s.prisoners++;log("Після судового процесу вигаданий персонаж отримав вирок.")}if(s.turn%4===0){s.influence=Math.min(100,s.influence+2);s.reputation=Math.min(100,s.reputation+1)}save();render()});render();
</script></body></html>
